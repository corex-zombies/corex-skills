<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>COREX :: Skill Tree</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Floating XP toasts (rendered above the panel, also visible in-game when
       the panel is closed because we send xpToast messages always). -->
  <div id="xpToasts" class="xp-toasts" aria-live="polite"></div>

  <!-- Lockpick minigame overlay. Hidden by default; revealed when any
       resource calls exports['corex-skills']:OpenLockpick(...). The k_lock
       skill widens the target zone making the minigame markedly easier. -->
  <div id="lockpick" class="lockpick hidden">
    <div class="lp-card">
      <div class="lp-title">LOCK PICK</div>
      <div class="lp-progress">
        <span id="lp-pin1" class="lp-pin"></span>
        <span id="lp-pin2" class="lp-pin"></span>
        <span id="lp-pin3" class="lp-pin"></span>
      </div>
      <div class="lp-track">
        <div id="lp-zone" class="lp-zone"></div>
        <div id="lp-cursor" class="lp-cursor"></div>
      </div>
      <div class="lp-hint">
        Press <kbd>SPACE</kbd> when the cursor is in the green zone.
        <span id="lp-status" class="lp-status">Pin 1 / 3</span>
      </div>
    </div>
  </div>

  <div id="skills-root" class="skills-root hidden">
    <div class="panel">

      <!-- HEADER -->
      <div class="header">
        <div class="player">
          <div class="avatar">
            <svg viewBox="-21 -21 42 42" aria-hidden="true">
              <polygon points="20,0 10,17.32 -10,17.32 -20,0 -10,-17.32 10,-17.32"
                fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.18)" stroke-width="0.7"></polygon>
            </svg>
            <span class="avatar-letter" id="avatarLetter">A</span>
          </div>
          <div class="player-text">
            <span class="player-cap">Player</span>
            <div class="player-line">
              <span class="player-name" id="playerName">Survivor</span>
              <span class="player-level" id="playerLevel">·&nbsp;LVL&nbsp;1</span>
            </div>
            <div class="xp-bar" id="xpBar">
              <div class="xp-fill" id="xpFill"></div>
              <span class="xp-text" id="xpText">0 / 100 XP</span>
            </div>
          </div>
        </div>

        <div class="segmented" id="segmentBar">
          <button class="seg seg-active" type="button">Human</button>
        </div>

        <div class="header-right">
          <div class="points">
            <span class="points-label">Available</span>
            <span class="points-num"><span id="pointsNum">0</span><em>pts</em></span>
          </div>
          <button class="btn-icon" id="respecBtn" type="button" title="Respec all skills">
            <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
              <path d="M3 12a9 9 0 0 1 15.5-6.3M21 12a9 9 0 0 1-15.5 6.3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              <path d="M18.5 3v3.7H14.8M5.5 21v-3.7H9.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
          </button>
          <button class="btn-icon" id="closeBtn" type="button" title="Close [ESC]">
            <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
              <path d="M5 5l14 14M19 5L5 19" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- TREE -->
      <div class="tree-wrap">
        <svg id="tree" class="tree-svg" viewBox="0 0 1360 620" xmlns="http://www.w3.org/2000/svg" aria-label="Skill Tree"></svg>
      </div>

      <!-- DETAIL -->
      <div class="detail" id="detail"></div>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
